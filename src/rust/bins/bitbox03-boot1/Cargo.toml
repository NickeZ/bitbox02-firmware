[package]
name = "bitbox03-boot1"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[[bin]]
name = "bitbox03-boot1"
path = "src/main.rs"
test = false
bench = false

[features]
board-stm32u5-dk = [
    "dep:bitbox-board-stm32u5-dk",
    "dep:bitbox-board-stm32u5-dk-build",
    "bitbox-boot-utils/board-stm32u5-dk",
    "bitbox03-memory/board-stm32u5-dk",
]
rtt = ["bitbox-debug/rtt", "dep:rtt-target"]

[dependencies]
bitbox-boot-utils = { path = "../../bitbox-boot-utils" }
bitbox-u2fhid = { path = "../../bitbox-u2fhid" }
bitbox03-memory = { path = "../../bitbox03-memory" }
sha2 = { workspace = true }

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
bitbox-executor = { path = "../../bitbox-executor" }
bitbox-board-stm32u5-dk = { path = "../../bitbox-board-stm32u5-dk", optional = true }
bitbox-mcu-stm32u5 = { path = "../../bitbox-mcu-stm32u5" }
bitbox-platform-stm32u5 = { path = "../../bitbox-platform-stm32u5" }
bitbox-debug = { path = "../../bitbox-debug" }
cortex-m = { workspace = true }
cortex-m-rt = "0.7"
embedded-alloc = { version = "0.7" }
log = { version = "0.4.22", default-features = false }
rtt-target = { version = "0.6.1", features = ["log"], optional = true }

[build-dependencies]
bitbox-board-stm32u5-dk-build = { path = "../../bitbox-board-stm32u5-dk-build", optional = true }
